<!doctype html>
<html lang="ca" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />

  <!-- SEO -->
  <title>TripNest — Planifica i comparteix viatges en grup</title>
  <meta name="description" content="TripNest és la plataforma per planificar, gestionar i comunicar-te en els teus viatges en grup." />
  <meta name="robots" content="index, follow" />

  <!-- Open Graph -->
  <meta property="og:title"       content="TripNest — Viatges en grup" />
  <meta property="og:description" content="Planifica, gestiona i comparteix viatges en grup." />
  <meta property="og:type"        content="website" />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />

  <!-- Theme color (barra mòbil) -->
  <meta name="theme-color" content="#0D2B45" />
  <meta name="color-scheme" content="light" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Lato', -apple-system, sans-serif;
      background: #F0F7FF;
      color: #0D2B45;
      min-height: 100vh;
    }

    /* Skip to content — WCAG 2.4.1 */
    .skip-to-content {
      position: fixed;
      top: -60px;
      left: 16px;
      background: #17A589;
      color: white;
      padding: 12px 20px;
      border-radius: 0 0 8px 8px;
      font-weight: 700;
      font-size: 0.9rem;
      text-decoration: none;
      z-index: 99999;
      transition: top 0.2s ease;
    }
    .skip-to-content:focus { top: 0; }

    /* Focus visible global — WCAG 2.4.7 */
    :focus-visible {
      outline: 2px solid #48C9B0;
      outline-offset: 3px;
      border-radius: 4px;
    }
  </style>
</head>

<body>
<!-- Root de React — tot el contingut es renderitza aquí -->
<div id="root"></div>

<!-- Fallback sense JavaScript — WCAG -->
<noscript>
  <div style="
        font-family:'Lato',sans-serif;
        background:linear-gradient(135deg,#0D2B45,#17A589);
        color:white; min-height:100vh;
        display:flex; flex-direction:column;
        align-items:center; justify-content:center;
        text-align:center; padding:40px 20px; gap:16px;
      ">
    <div style="font-size:3rem">🪺</div>
    <h1 style="font-family:Georgia,serif;font-size:2rem;font-weight:900">TripNest</h1>
    <p style="opacity:0.85;max-width:400px;line-height:1.6">
      TripNest requereix JavaScript per funcionar.<br/>
      Activa'l al teu navegador i refresca la pàgina.
    </p>
  </div>
</noscript>

<!-- Entry point de Vite/React -->
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
